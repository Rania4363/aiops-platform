apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aiops-engine
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Rania4363/aiops-platform.git
    targetRevision: main
    path: platform/aiops
  destination: {server: https://kubernetes.default.svc, namespace: aiops}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aiops-routing
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Rania4363/aiops-platform.git
    targetRevision: main
    path: platform/routing
  destination: {server: https://kubernetes.default.svc, namespace: dev}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
