apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aiops-llm
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Rania4363/aiops-platform.git
    targetRevision: main
    path: platform/llm
  destination: {server: https://kubernetes.default.svc, namespace: aiops}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
