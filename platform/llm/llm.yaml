apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: llm-models, namespace: aiops}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: {requests: {storage: 5Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: llm, namespace: aiops}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: llm}
  template:
    metadata:
      labels: {app: llm}
    spec:
      nodeSelector: {role: llm}
      initContainers:
        - name: fetch-model
          image: curlimages/curl:8.10.1
          command: ["sh", "-c"]
          args:
            - |
              F=/models/qwen2.5-1.5b-instruct-q4_k_m.gguf
              if [ ! -s "$F" ]; then
                curl -fL --retry 5 --retry-delay 5 -C - -o "$F.part" \
                  https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf \
                && mv "$F.part" "$F"
              fi
              ls -l /models
          volumeMounts:
            - {name: models, mountPath: /models}
      containers:
        - name: llama
          image: ghcr.io/ggml-org/llama.cpp:server
          args: ["-m", "/models/qwen2.5-1.5b-instruct-q4_k_m.gguf", "--host", "0.0.0.0", "--port", "8080", "-c", "4096", "-t", "4"]
          ports:
            - {name: http, containerPort: 8080}
          resources:
            requests: {cpu: "2", memory: 3Gi}
            limits: {cpu: "4", memory: 5Gi}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: models, mountPath: /models}
      volumes:
        - name: models
          persistentVolumeClaim: {claimName: llm-models}
---
apiVersion: v1
kind: Service
metadata: {name: llm, namespace: aiops}
spec:
  selector: {app: llm}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
# Seuls les pods du namespace aiops (notre futur moteur) peuvent interroger le LLM
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: llm-from-aiops-only, namespace: aiops}
spec:
  podSelector: {matchLabels: {app: llm}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
