apiVersion: v1
kind: ConfigMap
metadata:
  name: aiops-dashboard
  namespace: aiops
  labels:
    grafana_dashboard: "1"
data:
  aiops-demo-app.json: |
    {
     "uid": "aiops-demo-app",
     "title": "AIOps - demo-app (dev / prod)",
     "tags": [
      "aiops"
     ],
     "schemaVersion": 39,
     "version": 1,
     "editable": true,
     "refresh": "30s",
     "time": {
      "from": "now-1h",
      "to": "now"
     },
     "templating": {
      "list": [
       {
        "name": "namespace",
        "label": "Namespace",
        "type": "query",
        "datasource": {
         "type": "prometheus",
         "uid": "prometheus"
        },
        "query": {
         "query": "label_values(demo_http_requests_total, namespace)",
         "refId": "ns"
        },
        "refresh": 2,
        "includeAll": true,
        "multi": true,
        "current": {
         "text": "All",
         "value": "$__all"
        }
       }
      ]
     },
     "panels": [
      {
       "id": 1,
       "title": "Pods demo-app actifs",
       "type": "stat",
       "description": "Nombre de pods scrapés par Prometheus",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "gridPos": {
        "x": 0,
        "y": 0,
        "w": 6,
        "h": 4
       },
       "targets": [
        {
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "expr": "sum(up{job=\"demo-app\",namespace=~\"$namespace\"})",
         "legendFormat": ""
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "short",
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
            "color": "green",
            "value": null
           },
           {
            "color": "green",
            "value": 1
           }
          ]
         }
        },
        "overrides": []
       },
       "options": {
        "reduceOptions": {
         "calcs": [
          "lastNotNull"
         ]
        },
        "colorMode": "background"
       }
      },
      {
       "id": 2,
       "title": "Alertes AIOps en cours",
       "type": "stat",
       "description": "Alertes DemoApp* au statut firing",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "gridPos": {
        "x": 6,
        "y": 0,
        "w": 6,
        "h": 4
       },
       "targets": [
        {
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "expr": "count(ALERTS{project=\"aiops\",alertstate=\"firing\"}) or vector(0)",
         "legendFormat": ""
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "short",
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
            "color": "green",
            "value": null
           },
           {
            "color": "red",
            "value": 1
           }
          ]
         }
        },
        "overrides": []
       },
       "options": {
        "reduceOptions": {
         "calcs": [
          "lastNotNull"
         ]
        },
        "colorMode": "background"
       }
      },
      {
       "id": 3,
       "title": "Redémarrages de conteneur (1 h)",
       "type": "stat",
       "description": "",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "gridPos": {
        "x": 12,
        "y": 0,
        "w": 6,
        "h": 4
       },
       "targets": [
        {
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "expr": "sum(increase(kube_pod_container_status_restarts_total{container=\"app\",namespace=~\"$namespace\"}[1h])) or vector(0)",
         "legendFormat": ""
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "short",
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
            "color": "green",
            "value": null
           },
           {
            "color": "orange",
            "value": 1
           },
           {
            "color": "red",
            "value": 3
           }
          ]
         }
        },
        "overrides": []
       },
       "options": {
        "reduceOptions": {
         "calcs": [
          "lastNotNull"
         ]
        },
        "colorMode": "background"
       }
      },
      {
       "id": 4,
       "title": "Réplicas disponibles",
       "type": "stat",
       "description": "Visible après un changement de réplicas par Pull Request",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "gridPos": {
        "x": 18,
        "y": 0,
        "w": 6,
        "h": 4
       },
       "targets": [
        {
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "expr": "sum by (namespace) (kube_deployment_status_replicas_available{deployment=\"demo-app\",namespace=~\"$namespace\"})",
         "legendFormat": "{{namespace}}"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "short",
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
            "color": "green",
            "value": null
           }
          ]
         }
        },
        "overrides": []
       },
       "options": {
        "reduceOptions": {
         "calcs": [
          "lastNotNull"
         ]
        },
        "colorMode": "background"
       }
      },
      {
       "id": 5,
       "title": "Taux d'erreurs 5xx",
       "type": "timeseries",
       "description": "Seuil d'alerte DemoAppHighErrorRate : 20 %",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "gridPos": {
        "x": 0,
        "y": 4,
        "w": 12,
        "h": 8
       },
       "targets": [
        {
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "expr": "sum by (namespace) (rate(demo_http_requests_total{namespace=~\"$namespace\",status=\"500\"}[2m])) / clamp_min(sum by (namespace) (rate(demo_http_requests_total{namespace=~\"$namespace\"}[2m])), 0.001)",
         "legendFormat": "{{namespace}}"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "percentunit",
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
            "color": "green",
            "value": null
           },
           {
            "color": "red",
            "value": 0.2
           }
          ]
         },
         "custom": {
          "lineWidth": 2,
          "fillOpacity": 10,
          "thresholdsStyle": {
           "mode": "line"
          }
         }
        },
        "overrides": []
       },
       "options": {
        "legend": {
         "displayMode": "list",
         "placement": "bottom"
        },
        "tooltip": {
         "mode": "multi"
        }
       }
      },
      {
       "id": 6,
       "title": "Latence p95",
       "type": "timeseries",
       "description": "Seuil d'alerte DemoAppHighLatency : 1 s",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "gridPos": {
        "x": 12,
        "y": 4,
        "w": 12,
        "h": 8
       },
       "targets": [
        {
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "expr": "histogram_quantile(0.95, sum by (le, namespace) (rate(demo_http_request_seconds_bucket{namespace=~\"$namespace\"}[2m])))",
         "legendFormat": "{{namespace}}"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "s",
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
            "color": "green",
            "value": null
           },
           {
            "color": "red",
            "value": 1
           }
          ]
         },
         "custom": {
          "lineWidth": 2,
          "fillOpacity": 10,
          "thresholdsStyle": {
           "mode": "line"
          }
         }
        },
        "overrides": []
       },
       "options": {
        "legend": {
         "displayMode": "list",
         "placement": "bottom"
        },
        "tooltip": {
         "mode": "multi"
        }
       }
      },
      {
       "id": 7,
       "title": "Mémoire utilisée / limite",
       "type": "timeseries",
       "description": "Seuil d'alerte DemoAppMemoryNearLimit : 85 %",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "gridPos": {
        "x": 0,
        "y": 12,
        "w": 12,
        "h": 8
       },
       "targets": [
        {
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "expr": "max by (namespace, pod) (container_memory_working_set_bytes{container=\"app\",namespace=~\"$namespace\"}) / max by (namespace, pod) (kube_pod_container_resource_limits{resource=\"memory\",container=\"app\",namespace=~\"$namespace\"})",
         "legendFormat": "{{namespace}} {{pod}}"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "percentunit",
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
            "color": "green",
            "value": null
           },
           {
            "color": "red",
            "value": 0.85
           }
          ]
         },
         "custom": {
          "lineWidth": 2,
          "fillOpacity": 10,
          "thresholdsStyle": {
           "mode": "line"
          }
         }
        },
        "overrides": []
       },
       "options": {
        "legend": {
         "displayMode": "list",
         "placement": "bottom"
        },
        "tooltip": {
         "mode": "multi"
        }
       }
      },
      {
       "id": 8,
       "title": "Requêtes par code HTTP",
       "type": "timeseries",
       "description": "",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "gridPos": {
        "x": 12,
        "y": 12,
        "w": 12,
        "h": 8
       },
       "targets": [
        {
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "expr": "sum by (namespace, status) (rate(demo_http_requests_total{namespace=~\"$namespace\"}[2m]))",
         "legendFormat": "{{namespace}} {{status}}"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "reqps",
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
            "color": "green",
            "value": null
           }
          ]
         },
         "custom": {
          "lineWidth": 2,
          "fillOpacity": 10,
          "thresholdsStyle": {
           "mode": "line"
          }
         }
        },
        "overrides": []
       },
       "options": {
        "legend": {
         "displayMode": "list",
         "placement": "bottom"
        },
        "tooltip": {
         "mode": "multi"
        }
       }
      }
     ]
    }
