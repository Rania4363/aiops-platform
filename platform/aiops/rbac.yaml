apiVersion: v1
kind: ServiceAccount
metadata: {name: aiops-engine, namespace: aiops}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: aiops-reader, namespace: dev}
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, events]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: aiops-reader, namespace: prod}
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, events]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: aiops-reader, namespace: dev}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: aiops-reader}
subjects: [{kind: ServiceAccount, name: aiops-engine, namespace: aiops}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: aiops-reader, namespace: prod}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: aiops-reader}
subjects: [{kind: ServiceAccount, name: aiops-engine, namespace: aiops}]
