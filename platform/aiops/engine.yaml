apiVersion: apps/v1
kind: Deployment
metadata: {name: aiops-engine, namespace: aiops}
spec:
  replicas: 1
  selector:
    matchLabels: {app: aiops-engine}
  template:
    metadata:
      labels: {app: aiops-engine}
    spec:
      serviceAccountName: aiops-engine
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: engine
          image: ghcr.io/rania4363/aiops-engine
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: AUTO_REMEDIATION, value: "true"}
            - {name: AUTO_PULL_REQUEST, value: "true"}
            - {name: GITHUB_REPO, value: "Rania4363/aiops-platform"}
            - {name: GITHUB_TOKEN, valueFrom: {secretKeyRef: {name: aiops-secrets, key: github-token}}}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata: {name: aiops-engine, namespace: aiops}
spec:
  selector: {app: aiops-engine}
  ports:
    - {name: http, port: 8080, targetPort: http}
