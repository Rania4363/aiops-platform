name: promote-to-prod

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag à promouvoir (vide = tag actuellement déployé en dev)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Déterminer le tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG}"
          if [ -z "$TAG" ]; then
            TAG="$(grep -m1 'newTag:' manifests/overlays/dev/kustomization.yaml | awk '{print $2}')"
          fi
          if ! echo "$TAG" | grep -Eq '^sha-[0-9a-f]{7}$'; then
            echo "Tag invalide : refusé"; exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - name: Modifier l'overlay prod
        run: |
          sed -i "s/newTag: .*/newTag: ${TAG}/" manifests/overlays/prod/kustomization.yaml
          if git diff --quiet; then
            echo "Prod est déjà en ${TAG} : rien à promouvoir."
            echo "NOOP=1" >> "$GITHUB_ENV"
          fi
      - name: Valider que l'overlay prod se génère
        if: env.NOOP != '1'
        run: |
          kubectl kustomize manifests/overlays/prod > /tmp/prod.yaml
          echo "OK overlay prod ($(grep -c '^kind:' /tmp/prod.yaml) ressources, image $(grep -m1 'image:' /tmp/prod.yaml | awk '{print $2}'))"
      - name: Ouvrir la Pull Request
        if: env.NOOP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BR="promote/${TAG}"
          git checkout -b "$BR"
          git add manifests/overlays/prod/kustomization.yaml
          git commit -m "promote: prod -> ${TAG}"
          git push origin "$BR"
          gh pr create --base main --head "$BR" \
            --title "[Promotion] prod -> ${TAG}" \
            --body "Promotion du tag ${TAG} (déjà déployé et validé en dev) vers prod. Validation humaine requise avant merge."
