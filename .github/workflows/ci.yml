name: ci

on:
  push:
    branches: [main]
    paths: ["app/**", "aiops-engine/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["app/**", "aiops-engine/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [app, aiops-engine]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.project }}/requirements.txt
      - run: pip install -r ${{ matrix.project }}/requirements.txt
      - run: python -m pytest -q
        working-directory: ${{ matrix.project }}

  build-push:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - {project: app, image: demo-app}
          - {project: aiops-engine, image: aiops-engine}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Nom d'image (minuscules) et tag
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}" >> "$GITHUB_ENV"
          echo "TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      # 1) Construction arm64, chargée localement : rien n'est publié avant les contrôles
      - name: Build arm64 (local)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.project }}
          platforms: linux/arm64
          load: true
          tags: local/${{ matrix.image }}:${{ env.TAG }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # 2) L'image démarre vraiment, et ne tourne pas en root
      - name: Test de démarrage de l'image
        run: |
          docker run --rm --platform linux/arm64 local/${{ matrix.image }}:${{ env.TAG }} python -c "import main; print('import ok')"
          test "$(docker run --rm --platform linux/arm64 local/${{ matrix.image }}:${{ env.TAG }} id -u)" = "10001"

      # 3) Scan de vulnérabilités. Action épinglée sur une empreinte de commit (tag 0.35.0) :
      #    des tags de trivy-action ont été détournés en mars 2026, un tag n'est pas une garantie.
      - name: Scan Trivy (échec si CRITICAL corrigeable)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: local/${{ matrix.image }}:${{ env.TAG }}
          version: v0.69.3
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      # 4) Connexion au registre et publication : seulement si tout ce qui précède est passé
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publication sur GHCR
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.project }}
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}

  update-manifests:
    needs: build-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Mettre à jour les tags d'image
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          sed -i "s/newTag: .*/newTag: ${TAG}/" manifests/overlays/dev/kustomization.yaml platform/aiops/kustomization.yaml
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifests platform
          git diff --cached --quiet || git commit -m "ci: déploiement dev sha-${GITHUB_SHA::7} [skip ci]"
          git pull --rebase
          git push
