apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod
resources:
  - ../../base
images:
  - name: ghcr.io/rania4363/demo-app
    newName: ghcr.io/rania4363/demo-app
    newTag: sha-0ae0a79
patches:
  - target: {kind: Deployment, name: demo-app}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: prod
  - target: {kind: Deployment, name: demo-app}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
