apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  labels: {app: demo-app}
spec:
  replicas: 1
  selector:
    matchLabels: {app: demo-app}
  template:
    metadata:
      labels: {app: demo-app}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: ghcr.io/rania4363/demo-app
          ports:
            - {name: http, containerPort: 8000}
          env:
            - {name: FAULT_MODE, value: "none"}
            - {name: APP_VERSION, value: "base"}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: demo-app
  labels: {app: demo-app}
spec:
  selector: {app: demo-app}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: demo-app
  labels: {app: demo-app}
spec:
  selector:
    matchLabels: {app: demo-app}
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
